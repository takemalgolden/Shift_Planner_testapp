{% extends "base.html" %}
{% block content %}
<h1>勤務パターン</h1>
<div class="card">
  <h2>新規追加</h2>
  <form method="post">
    <input type="hidden" name="action" value="add">
    <div class="grid">
      <label class="field">名称<input name="name" required placeholder="例: 短時間早番"></label>
      <label class="field">開始<input type="time" name="start_time" value="09:20" required></label>
      <label class="field">終了<input type="time" name="end_time" value="18:00" required></label>
      <label class="field">休憩（分）<input type="number" name="break_minutes" min="0" max="240" value="60" required></label>
    </div>
    <button>追加</button>
  </form>
</div>
<div class="card">
  <h2>登録済みパターンの編集・削除</h2>
  <p class="muted small">削除済みのパターンも履歴表示のため一覧に残る場合があります。過去シフトで使用されているパターンは、記録を壊さないよう無効化します。</p>
  <table>
    <tr><th>名称</th><th>開始</th><th>終了</th><th>休憩（分）</th><th>状態</th><th>操作</th></tr>
    {% for p in patterns %}
    <tr>
      <td colspan="6">
        <form method="post" class="grid" style="align-items:end">
          <input type="hidden" name="action" value="update">
          <input type="hidden" name="pattern_id" value="{{ p.id }}">
          <label class="field">名称<input name="name" value="{{ p.name }}" required></label>
          <label class="field">開始<input type="time" name="start_time" value="{{ p.start_time }}" required></label>
          <label class="field">終了<input type="time" name="end_time" value="{{ p.end_time }}" required></label>
          <label class="field">休憩（分）<input type="number" name="break_minutes" min="0" max="240" value="{{ p.break_minutes }}" required></label>
          <label class="field">状態<select name="active"><option value="1" {% if p.active %}selected{% endif %}>有効</option><option value="0" {% if not p.active %}selected{% endif %}>無効</option></select></label>
          <div><button>変更を保存</button></div>
        </form>
        <form method="post" onsubmit="return confirm('この勤務パターンを削除または無効化しますか？')">
          <input type="hidden" name="action" value="delete"><input type="hidden" name="pattern_id" value="{{ p.id }}">
          <button class="danger">削除</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
