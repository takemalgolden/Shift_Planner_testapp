{% extends "base.html" %}{% block content %}<div class="card" style="max-width:520px;margin:40px auto"><h1>オペレーター新規登録</h1><p>申請後、管理者が承認するとログインできます。</p><form method="post"><label class="field">ログインID<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" autocomplete="username"></label><label class="field">氏名<input name="name" required maxlength="100"></label><label class="field">パスワード<input id="pw" name="password" type="password" required minlength="8" maxlength="16" autocomplete="new-password"></label><label><input type="checkbox" onclick="document.getElementById('pw').type=this.checked?'text':'password';document.getElementById('pw2').type=this.checked?'text':'password'">パスワードを表示</label><label class="field">パスワード確認<input id="pw2" name="confirm_password" type="password" required minlength="8" maxlength="16" autocomplete="new-password"></label><p class="small muted">8～16文字・英大文字/小文字/数字/記号のうち3種類以上</p><p>保有スキル（1つ以上）</p>{% for skill in ['consumer','merchant','PP'] %}<label style="margin-right:14px"><input type="checkbox" name="skills" value="{{ skill }}">{{ skill }}</label>{% endfor %}<p><button type="submit">登録を申請する</button></p></form><a href="{{ url_for('login') }}">ログインに戻る</a></div>{% endblock %}
