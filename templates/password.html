{% extends "base.html" %}{% block content %}<h1>パスワード変更</h1><div class="card" style="max-width:500px"><form method="post">
<label class="field">現在のパスワード<input type="password" name="old_password" required></label>
<label class="field">新しいパスワード（8〜16文字）<input type="password" name="new_password" required minlength="8" maxlength="16"></label>
<p class="muted small">大文字・小文字・数字・記号のうち3種類以上を含めてください。</p><button>変更</button></form></div>{% endblock %}
