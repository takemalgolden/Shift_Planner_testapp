{% extends "base.html" %}{% block content %}<h1>パスワード変更</h1>
{% if forced %}<div class="warning">管理者による再設定後のため、続行するにはパスワードを変更してください。</div>{% endif %}
<div class="card" style="max-width:560px"><form method="post">
<label class="field">現在のパスワード<input type="password" name="old_password" required autocomplete="current-password"></label>
<label class="field">新しいパスワード（8〜16文字）<input type="password" id="new_pw" name="new_password" required minlength="8" maxlength="16" autocomplete="new-password"></label>
<label class="field">新しいパスワード（確認）<input type="password" id="confirm_pw" name="confirm_password" required minlength="8" maxlength="16" autocomplete="new-password"></label>
<label><input type="checkbox" onchange="for(const id of ['new_pw','confirm_pw'])document.getElementById(id).type=this.checked?'text':'password'"> 新しいパスワードを表示</label>
<p class="muted small">大文字・小文字・数字・記号のうち3種類以上を含めてください。</p><button>変更</button></form></div>{% endblock %}
