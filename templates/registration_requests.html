{% extends "base.html" %}{% block content %}<h1>オペレーター登録申請</h1><p>本人確認後に承認してください。承認すると従業員とログインアカウントが作成されます。</p><div class="card"><table><tr><th>申請日時</th><th>ログインID</th><th>氏名</th><th>スキル</th><th>操作</th></tr>{% for r in rows %}<tr><td>{{ r.created_at }}</td><td>{{ r.username }}</td><td>{{ r.name }}</td><td>{{ r.skills }}</td><td><form method="post" style="display:inline" onsubmit="return confirm('この申請を承認しますか？')"><input type="hidden" name="request_id" value="{{ r.id }}"><input type="hidden" name="action" value="approve"><button>承認</button></form> <form method="post" style="display:inline" onsubmit="return confirm('この申請を却下しますか？')"><input type="hidden" name="request_id" value="{{ r.id }}"><input type="hidden" name="action" value="reject"><button class="danger">却下</button></form></td></tr>{% else %}<tr><td colspan="5">承認待ちの申請はありません。</td></tr>{% endfor %}</table></div>{% endblock %}
